version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: bull_project/Dockerfile
    container_name: bull_api
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bull:password@db:5432/bull_db
      - SKIP_BOT=true
      - PASSPORT_ENGINE=easyocr
      - POPPLER_PATH=/usr/bin
    command: uvicorn bull_project.bull_bot.core.api_server:app --host 0.0.0.0 --port 8000
    ports:
      # Только localhost: снаружи в API напрямую не достучаться, трафик идёт через Caddy.
      - "127.0.0.1:8000:8000"
    volumes:
      - /data/booking_cards:/app/bull_project/bull_bot/tmp/booking_cards
      - /data/uploads:/app/bull_project/bull_bot/tmp/uploads

  worker:
    build:
      context: ..
      dockerfile: bull_project/Dockerfile
    container_name: bull_worker
    restart: always
    depends_on:
      - db
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bull:password@db:5432/bull_db
      - SKIP_BOT=false
      - PASSPORT_ENGINE=easyocr
      - POPPLER_PATH=/usr/bin
      - OCR_API_URL=http://api:8000
    command: python -m bull_project.bull_bot.main
    volumes:
      - /data/booking_cards:/app/bull_project/bull_bot/tmp/booking_cards
      - /data/uploads:/app/bull_project/bull_bot/tmp/uploads

  db:
    image: postgres:17-alpine
    container_name: bull_postgres
    restart: always
    environment:
      - POSTGRES_USER=bull
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bull_db
    volumes:
      - /data/postgres17:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

