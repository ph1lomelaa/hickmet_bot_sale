<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель - Hickmet Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-primary: #FAF8F5;
            --bg-secondary: #F5F1EB;
            --bg-card: #FFFFFF;
            --accent-brown: #9B8474;
            --accent-dark: #6B5D52;
            --accent-light: #C4B5A7;
            --text-primary: #3D3935;
            --text-secondary: #8A827C;
            --border-color: #E8E3DC;
            --shadow-soft: 0 4px 12px rgba(107, 93, 82, 0.08);
            --shadow-medium: 0 8px 24px rgba(107, 93, 82, 0.12);
            --success-bg: #E8F5E9;
            --success-text: #2E7D32;
            --danger-bg: #FFEBEE;
            --danger-text: #C62828;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-header {
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-medium);
            text-align: center;
            color: white;
        }

        .app-header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .app-header p {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 400;
        }

        .header {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-top: 0;
            flex-wrap: wrap;
        }

        .tab {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
            color: var(--text-primary);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: white;
            border-color: var(--accent-brown);
        }

        .tab:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-soft);
        }

        .content-section {
            display: none;
            background: var(--bg-card);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border-color);
            animation: fadeIn 0.3s;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            padding: 20px;
            border-radius: 15px;
            color: white;
            text-align: center;
            box-shadow: var(--shadow-soft);
        }

        .stat-card h3 {
            font-size: 14px;
            font-weight: 500;
            opacity: 0.95;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
        }

        .date-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .date-selector input {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            flex: 1;
            min-width: 150px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .date-selector input:focus {
            outline: none;
            border-color: var(--accent-brown);
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0 20px;
        }

        .quick-actions .btn {
            flex: 1;
            min-width: 220px;
            text-align: center;
        }

        .btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--accent-light);
            color: white;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        .manager-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--bg-secondary);
            color: var(--accent-dark);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: var(--bg-secondary);
        }

        .chart-container {
            margin: 20px 0;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        .manager-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .manager-card:hover {
            border-color: var(--accent-brown);
            transform: translateX(5px);
            box-shadow: var(--shadow-soft);
        }

        .manager-card h3 {
            color: var(--accent-dark);
            margin-bottom: 10px;
        }

        .manager-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .manager-stats span {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-brown);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent-brown);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-brown);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .expand-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        .expand-btn:hover {
            background: var(--accent-light);
            color: white;
            border-color: var(--accent-light);
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .booking-item {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .passport-image {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
            object-fit: cover;
        }

        .booking-item h4 {
            color: var(--accent-dark);
            margin-bottom: 8px;
        }

        .booking-item p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HICKMET PREMIUM HEADER -->
        <div class="app-header">
            <h1>Hickmet Premium</h1>
        </div>

        <!-- TABS -->
        <div class="header">
            <div class="tabs">
                <button class="tab active" onclick="showTab('overview')">Общая статистика</button>
                <button class="tab" onclick="showTab('managers')">Менеджеры</button>
                <button class="tab" onclick="showTab('packages')">Поиск пакетов</button>
            </div>
        </div>

        <div class="quick-actions">
            <button class="btn" onclick="openPilgrimSearch()">🔎 Найти паломника</button>
        </div>

        <!-- ОБЩАЯ СТАТИСТИКА -->
        <div id="overview" class="content-section active">
            <h2 style="margin-bottom: 20px; color: var(--accent-dark);">Статистика продаж</h2>

            <div class="date-selector">
                <input type="date" id="start-date" />
                <input type="date" id="end-date" />
                <button class="btn" onclick="loadAnalytics()">Загрузить</button>
                <button class="btn btn-secondary" onclick="setQuickPeriod('today')">Сегодня</button>
                <button class="btn btn-secondary" onclick="setQuickPeriod('week')">Неделя</button>
                <button class="btn btn-secondary" onclick="setQuickPeriod('month')">Месяц</button>
            </div>

            <div class="stats-grid" id="main-stats">
                <!-- Динамически заполняется -->
            </div>

            <div class="chart-container">
                <h3 style="margin-bottom: 15px; color: var(--accent-dark);">Динамика продаж</h3>
                <canvas id="salesChart"></canvas>
            </div>

            <div class="table-container">
                <h3 style="margin: 20px 0; color: var(--accent-dark);">ТОП-10 Пакетов</h3>
                <div id="top-packages-container" style="max-height: 400px; overflow-y: auto;">
                    <!-- Таблица пакетов -->
                </div>
                <button class="expand-btn" onclick="expandPackages()">Показать все пакеты</button>
            </div>

            <div class="table-container">
                <h3 style="margin: 20px 0; color: var(--accent-dark);">Рейтинг менеджеров</h3>
                <table id="managers-rating">
                    <!-- Таблица менеджеров -->
                </table>
            </div>
        </div>

        <!-- МЕНЕДЖЕРЫ -->
        <div id="managers" class="content-section">
            <h2 style="margin-bottom: 20px; color: var(--accent-dark);">Менеджеры</h2>

            <div id="managers-list">
                <!-- Список менеджеров -->
            </div>

            <div id="manager-detail" style="display: none;">
                <div class="manager-actions">
                    <button class="btn btn-secondary" onclick="closeManagerDetail()">← Назад к списку</button>
                    <button class="btn" id="open-history-btn" onclick="openManagerHistory()" disabled>История менеджера</button>
                </div>
                <div id="manager-detail-content"></div>
            </div>
        </div>

        <!-- ПОИСК ПАКЕТОВ -->
        <div id="packages" class="content-section">
            <h2 style="margin-bottom: 20px; color: var(--accent-dark);">Поиск пакетов по дате</h2>

            <div class="date-selector">
                <input type="text" id="package-search-date" placeholder="Введите дату (ДД.ММ)" />
                <button class="btn" onclick="searchPackages()">Найти</button>
            </div>

            <div id="packages-results">
                <!-- Результаты поиска -->
            </div>
        </div>

    </div>

    <script>
        // Telegram WebApp инициализация
        const tg = window.Telegram.WebApp;
        tg.expand();

        // API базовый URL (из общего конфига)
        const API_BASE = window.BULL_API_URL;
        const HISTORY_WEBAPP_URL = 'https://ph1lomelaa.github.io/book/history_v2.html';
        const SEARCH_WEBAPP_URL = 'https://ph1lomelaa.github.io/book/search-pilgrim.html';

        let salesChart = null;
        let allBookingsData = [];
        let currentStatusFilter = 'all';
        let currentManagerId = null;

        // Обёртка для fetch с заголовками ngrok
        async function apiFetch(url, options = {}) {
            const headers = {
                'ngrok-skip-browser-warning': '1',
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        }

        // Переключение табов
        function showTab(tabName) {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Загрузка данных при переключении
            if (tabName === 'managers') {
                loadManagers();
            }
        }

        // Установка быстрых периодов
        function setQuickPeriod(period) {
            const today = new Date();
            const endDate = today.toISOString().split('T')[0];
            let startDate;

            if (period === 'today') {
                startDate = endDate;
            } else if (period === 'week') {
                const weekAgo = new Date(today);
                weekAgo.setDate(today.getDate() - 7);
                startDate = weekAgo.toISOString().split('T')[0];
            } else if (period === 'month') {
                const monthAgo = new Date(today);
                monthAgo.setMonth(today.getMonth() - 1);
                startDate = monthAgo.toISOString().split('T')[0];
            }

            document.getElementById('start-date').value = startDate;
            document.getElementById('end-date').value = endDate;

            loadAnalytics();
        }

        // Загрузка аналитики
        async function loadAnalytics() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            if (!startDate || !endDate) {
                tg.showAlert('Выберите период!');
                return;
            }

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/analytics?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();

                if (data.ok) {
                    renderStats(data);
                    renderChart(data.daily_dynamics);
                    renderTopPackages(data.top_packages);
                    renderManagersRating(data.managers_rating);
                } else {
                    tg.showAlert('Ошибка загрузки данных');
                }
            } catch (error) {
                console.error(error);
                tg.showAlert('Ошибка соединения');
            }
        }

        // Отрисовка статистики
        function renderStats(data) {
            const container = document.getElementById('main-stats');
            container.innerHTML = `
                <div class="stat-card">
                    <h3>Всего продаж</h3>
                    <div class="value">${data.total_bookings}</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #C4B5A7 0%, #9B8474 100%);">
                    <h3>Отменено</h3>
                    <div class="value">${data.total_cancelled}</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #9B8474 0%, #6B5D52 100%);">
                    <h3>% Отмен</h3>
                    <div class="value">${data.cancellation_rate}%</div>
                </div>
            `;
        }

        // Отрисовка графика
        function renderChart(dynamics) {
            const ctx = document.getElementById('salesChart').getContext('2d');

            if (salesChart) {
                salesChart.destroy();
            }

            const labels = dynamics.map(d => d[0]);
            const values = dynamics.map(d => d[1]);

            salesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Продажи',
                        data: values,
                        borderColor: '#9B8474',
                        backgroundColor: 'rgba(155, 132, 116, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        // ТОП пакетов
        function renderTopPackages(packages) {
            const container = document.getElementById('top-packages-container');
            const top10 = packages.slice(0, 10);

            let html = '<table><thead><tr><th>Пакет</th><th>Продаж</th></tr></thead><tbody>';
            top10.forEach(([name, count]) => {
                html += `<tr><td>${name}</td><td><strong>${count}</strong></td></tr>`;
            });
            html += '</tbody></table>';

            container.innerHTML = html;
        }

        // Рейтинг менеджеров
        function renderManagersRating(managers) {
            const table = document.getElementById('managers-rating');

            let html = '<thead><tr><th>Менеджер</th><th>Продаж</th><th>Отменено</th></tr></thead><tbody>';
            managers.forEach(([name, total, cancelled]) => {
                html += `<tr><td>${name}</td><td><strong>${total}</strong></td><td style="color: var(--danger-text);">${cancelled}</td></tr>`;
            });
            html += '</tbody></table>';

            table.innerHTML = html;
        }

        // Загрузка списка менеджеров
        async function loadManagers() {
            const container = document.getElementById('managers-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Загрузка...</p></div>';

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/managers`);
                const data = await response.json();

                if (data.ok) {
                    const cards = data.managers.map(manager => `
                        <div class="manager-card" onclick="showManagerDetail(${manager.telegram_id}, '${manager.full_name}')">
                            <h3>${manager.full_name}</h3>
                            <div class="manager-stats">
                                <span>ID: ${manager.telegram_id}</span>
                                <span>Роль: ${manager.role}</span>
                            </div>
                        </div>
                    `).join('');
                    container.innerHTML = cards || '<p style="color: var(--text-secondary);">Менеджеры не найдены</p>';
                } else {
                    container.innerHTML = '<p>Ошибка загрузки</p>';
                }
            } catch (error) {
                container.innerHTML = '<p>Ошибка загрузки</p>';
            }
        }

        // Детали менеджера
        async function showManagerDetail(managerId, managerName) {
            document.getElementById('managers-list').style.display = 'none';
            document.getElementById('manager-detail').style.display = 'block';
            currentManagerId = managerId;
            const historyBtn = document.getElementById('open-history-btn');
            if (historyBtn) historyBtn.disabled = false;

            const endDateObj = new Date();
            const startDateObj = new Date(endDateObj);
            startDateObj.setMonth(endDateObj.getMonth() - 1);
            const startDate = startDateObj.toISOString().split('T')[0];
            const endDate = endDateObj.toISOString().split('T')[0];

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/manager/${managerId}?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();

                if (data.ok) {
                    let html = `
                        <h2 style="margin: 20px 0; color: var(--accent-dark);">${managerName}</h2>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <h3>Всего броней</h3>
                                <div class="value">${data.total}</div>
                            </div>
                            <div class="stat-card" style="background: linear-gradient(135deg, #C4B5A7 0%, #9B8474 100%);">
                                <h3>Активных</h3>
                                <div class="value">${data.active}</div>
                            </div>
                            <div class="stat-card" style="background: linear-gradient(135deg, #9B8474 0%, #6B5D52 100%);">
                                <h3>Отменено</h3>
                                <div class="value">${data.cancelled}</div>
                            </div>
                        </div>

                        <h3 style="margin: 20px 0; color: var(--accent-dark);">История броней:</h3>
                    `;

                    data.bookings.forEach(booking => {
                        const statusBadge = booking.status === 'cancelled' ?
                            '<span class="badge badge-danger">Отменено</span>' :
                            '<span class="badge badge-success">Активно</span>';

                        const createdDate = booking.created_at ? new Date(booking.created_at).toLocaleDateString('ru-RU') : '-';
                        const passportImage = booking.passport_image_path
                            ? `<img src="${API_BASE}/api/care/passport-photo/${booking.id}?ngrok-skip-browser-warning=1" class="passport-image" alt="Паспорт" onerror="this.style.display='none'">`
                            : '';

                        html += `
                            <div class="booking-item">
                                <h4>${booking.guest_last_name} ${booking.guest_first_name}</h4>
                                ${passportImage}
                                <p>Пакет: ${booking.package_name}</p>
                                <p>Лист: ${booking.sheet_name}</p>
                                <p>Цена: ${booking.price} тг | ${statusBadge}</p>
                                <p style="font-size: 12px; color: var(--text-secondary);">Создано: ${createdDate}</p>
                            </div>
                        `;
                    });

                    document.getElementById('manager-detail-content').innerHTML = html;
                }
            } catch (error) {
                console.error(error);
            }
        }

        function openManagerHistory(managerIdOverride) {
            const managerId = managerIdOverride || currentManagerId;
            if (!managerId) {
                tg.showAlert('Сначала выберите менеджера');
                return;
            }
            const url = `${HISTORY_WEBAPP_URL}?managerId=${managerId}`;
            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function openPilgrimSearch() {
            const url = SEARCH_WEBAPP_URL;
            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function closeManagerDetail() {
            document.getElementById('managers-list').style.display = 'block';
            document.getElementById('manager-detail').style.display = 'none';
            currentManagerId = null;
            const historyBtn = document.getElementById('open-history-btn');
            if (historyBtn) historyBtn.disabled = true;
        }

        // Поиск пакетов
        async function searchPackages() {
            const dateStr = document.getElementById('package-search-date').value;
            if (!dateStr) {
                tg.showAlert('Введите дату!');
                return;
            }

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/search/packages?date=${dateStr}`);
                const data = await response.json();

                if (data.ok) {
                    let html = '<h3 style="margin: 20px 0; color: var(--accent-dark);">Результаты поиска:</h3>';

                    if (data.packages.length === 0) {
                        html += '<p style="color: var(--text-secondary);">Пакеты не найдены</p>';
                    } else {
                        data.packages.forEach(pkg => {
                            html += `
                                <div class="booking-item">
                                    <h4>${pkg.package_name}</h4>
                                    <p>Лист: ${pkg.sheet_name}</p>
                                    <p>Продано: <strong>${pkg.count}</strong></p>
                                </div>
                            `;
                        });
                    }

                    document.getElementById('packages-results').innerHTML = html;
                }
            } catch (error) {
                tg.showAlert('Ошибка поиска');
            }
        }

        // Показываем полный список найденных пакетов (без обрезки)
        let lastPackages = [];

        // Сохраняем результаты поиска
        const originalSearchPackages = searchPackages;
        searchPackages = async function() {
            await originalSearchPackages();
            const container = document.getElementById('packages-results');
            // Если контейнер уже содержит данные, кешируем их
            const cards = container.querySelectorAll('.booking-item');
            if (cards.length) {
                lastPackages = Array.from(cards).map(card => card.outerHTML).join('');
            }
        };

        function expandPackages() {
            const container = document.getElementById('packages-results');
            if (!lastPackages || lastPackages.length === 0) {
                tg.showAlert('Сначала выполните поиск по дате');
                return;
            }
            container.innerHTML = `<div class="bookings-container">${lastPackages}</div>`;
        }

        // === СПИСОК БРОНЕЙ ===

        // Установка периода для броней
        function setBookingsPeriod(period) {
            const today = new Date();
            const endDate = today.toISOString().split('T')[0];
            let startDate;

            if (period === 'today') {
                startDate = endDate;
            } else if (period === 'week') {
                const weekAgo = new Date(today);
                weekAgo.setDate(today.getDate() - 7);
                startDate = weekAgo.toISOString().split('T')[0];
            } else if (period === 'month') {
                const monthAgo = new Date(today);
                monthAgo.setMonth(today.getMonth() - 1);
                startDate = monthAgo.toISOString().split('T')[0];
            }

            document.getElementById('bookings-start-date').value = startDate;
            document.getElementById('bookings-end-date').value = endDate;

            loadAllBookings();
        }

        // Загрузка всех броней
        async function loadAllBookings() {
            const startDate = document.getElementById('bookings-start-date').value;
            const endDate = document.getElementById('bookings-end-date').value;

            if (!startDate || !endDate) {
                tg.showAlert('Выберите период!');
                return;
            }

            const container = document.getElementById('bookings-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Загрузка броней...</p></div>';

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/bookings?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();

                if (data.ok) {
                    allBookingsData = data.bookings;
                    renderBookingsList(allBookingsData);
                } else {
                    container.innerHTML = '<p style="color: var(--text-secondary);">Ошибка загрузки броней</p>';
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = '<p style="color: var(--text-secondary);">Ошибка соединения с сервером</p>';
            }
        }

        // Отрисовка списка броней
        function renderBookingsList(bookings) {
            const container = document.getElementById('bookings-list');

            if (bookings.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 40px;">Броней не найдено</p>';
                return;
            }

            let html = '';
            bookings.forEach(booking => {
                const statusBadge = getStatusBadge(booking.status);
                const createdDate = new Date(booking.created_at).toLocaleDateString('ru-RU');
                const createdTime = new Date(booking.created_at).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});
                const passportImage = booking.passport_image_path
                    ? `<img src="${API_BASE}/api/care/passport-photo/${booking.id}?ngrok-skip-browser-warning=1" class="passport-image" alt="Паспорт" onerror="this.style.display='none'">`
                    : '';

                html += `
                    <div class="booking-item">
                        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                            <h4>${booking.guest_last_name} ${booking.guest_first_name}</h4>
                            ${statusBadge}
                        </div>
                        ${passportImage}
                        <p><strong>Пакет:</strong> ${booking.package_name}</p>
                        <p><strong>Лист:</strong> ${booking.sheet_name}</p>
                        <p><strong>Тип номера:</strong> ${booking.room_type || 'Не указан'}</p>
                        <p><strong>Цена:</strong> ${booking.price} тг</p>
                        <p><strong>Менеджер:</strong> ${booking.manager_name}</p>
                        <p><strong>Создано:</strong> ${createdDate} в ${createdTime}</p>
                        ${booking.notes ? `<p><strong>Комментарий:</strong> ${booking.notes}</p>` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Получение badge для статуса
        function getStatusBadge(status) {
            const statusMap = {
                'new': '<span class="badge badge-success">Активная</span>',
                'cancelled': '<span class="badge badge-danger">Отменена</span>',
                'rescheduled': '<span class="badge" style="background: #FFF3E0; color: #E65100;">Перенос</span>'
            };
            return statusMap[status] || '<span class="badge badge-success">Активная</span>';
        }

        // Фильтрация броней по статусу
        function filterBookingsByStatus(status) {
            currentStatusFilter = status;

            // Обновляем активную вкладку
            const tabs = document.querySelectorAll('#bookings .tab');
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            let filteredBookings;
            if (status === 'all') {
                filteredBookings = allBookingsData;
            } else if (status === 'active') {
                filteredBookings = allBookingsData.filter(b => b.status === 'new');
            } else {
                filteredBookings = allBookingsData.filter(b => b.status === status);
            }

            renderBookingsList(filteredBookings);
        }

        // Инициализация при загрузке
        window.addEventListener('load', () => {
            // Устанавливаем текущую дату
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start-date').value = today;
            document.getElementById('end-date').value = today;
            document.getElementById('manager-start-date').value = today;
            document.getElementById('manager-end-date').value = today;
            document.getElementById('bookings-start-date').value = today;
            document.getElementById('bookings-end-date').value = today;

            // Загружаем статистику за сегодня
            setQuickPeriod('today');
        });
    </script>
</body>
</html>
