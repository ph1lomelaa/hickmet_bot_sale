<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель - Hickmet Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            /* Премиальная палитра */
            --bg-primary: #FAF8F5;
            --bg-secondary: #F5F1EB;
            --bg-card: #FFFFFF;
            --accent-primary: #8B7355;
            --accent-brown: #9B8474;
            --accent-dark: #6B5D52;
            --accent-light: #C4B5A7;
            --text-primary: #2D2A26;
            --text-secondary: #8A827C;
            --border-color: #E8E3DC;
            
            /* Расширенная палитра */
            --gold: #D4AF37;
            --gold-light: #F4E5C2;
            --success-bg: #E8F5E9;
            --success-text: #2E7D32;
            --success-border: #81C784;
            --danger-bg: #FFEBEE;
            --danger-text: #C62828;
            --danger-border: #E57373;
            --warning-bg: #FFF3E0;
            --warning-text: #E65100;
            
            /* Премиальные тени */
            --shadow-xs: 0 1px 3px rgba(107, 93, 82, 0.05);
            --shadow-sm: 0 2px 8px rgba(107, 93, 82, 0.08);
            --shadow-md: 0 4px 16px rgba(107, 93, 82, 0.12);
            --shadow-lg: 0 8px 32px rgba(107, 93, 82, 0.16);
            --shadow-xl: 0 16px 48px rgba(107, 93, 82, 0.20);
            --shadow-glow: 0 0 32px rgba(212, 175, 55, 0.3);
            
            /* Анимации */
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FAF8F5 0%, #F5F1EB 50%, #EBE7E0 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 24px;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Декоративный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 115, 85, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Премиальный заголовок */
        .app-header {
            background: linear-gradient(135deg, #8B7355 0%, #6B5D52 100%);
            border-radius: 24px;
            padding: 48px 40px;
            margin-bottom: 32px;
            box-shadow: var(--shadow-xl);
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.1) 50%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .app-header h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            position: relative;
            text-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }

        .app-header p {
            font-size: 16px;
            opacity: 0.95;
            font-weight: 500;
            letter-spacing: 0.3px;
            position: relative;
        }

        /* Улучшенный header с табами */
        .header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 14px 28px;
            background: var(--bg-secondary);
            border: 2px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            transition: all var(--transition-base);
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.3px;
        }

        .tab::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(139, 115, 85, 0.1);
            transform: translate(-50%, -50%);
            transition: width var(--transition-base), height var(--transition-base);
        }

        .tab:hover::before {
            width: 300px;
            height: 300px;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-dark) 100%);
            color: white;
            border-color: var(--accent-dark);
            box-shadow: var(--shadow-md), 0 0 20px rgba(139, 115, 85, 0.3);
            transform: translateY(-2px);
        }

        .tab:hover:not(.active) {
            transform: translateY(-3px);
            box-shadow: var(--shadow-sm);
            border-color: var(--accent-light);
            background: white;
        }

        .content-section {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            animation: fadeInUp var(--transition-slow);
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(20px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        /* Премиальные статистические карточки */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-dark) 100%);
            padding: 32px 28px;
            border-radius: 20px;
            color: white;
            text-align: center;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            transition: all var(--transition-base);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            transition: transform var(--transition-slow);
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-xl), var(--shadow-glow);
        }

        .stat-card:hover::before {
            transform: translate(-25%, -25%) scale(1.5);
        }

        .stat-card h3 {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 16px;
            position: relative;
        }

        .stat-card .value {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            position: relative;
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Варианты цветов для карточек */
        .stat-card.variant-2 {
            background: linear-gradient(135deg, #C4B5A7 0%, #9B8474 100%);
        }

        .stat-card.variant-3 {
            background: linear-gradient(135deg, #9B8474 0%, #6B5D52 100%);
        }

        .stat-card.variant-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #C19A2E 100%);
        }

        /* Улучшенный date selector */
        .date-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .date-selector input {
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-size: 15px;
            flex: 1;
            min-width: 160px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-primary);
            background: white;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-xs);
        }

        .date-selector input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-sm), 0 0 0 3px rgba(139, 115, 85, 0.1);
            transform: translateY(-2px);
        }

        .quick-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin: 12px 0 28px;
        }

        .quick-actions .btn {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        /* Премиальные кнопки */
        .btn {
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-dark) 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transform: translate(-50%, -50%);
            transition: width var(--transition-base), height var(--transition-base);
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md), 0 0 20px rgba(139, 115, 85, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-xs);
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-brown) 100%);
            color: white;
            border-color: var(--accent-light);
        }

        /* Улучшенные таблицы */
        .table-container {
            overflow-x: auto;
            margin-top: 24px;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            background: white;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th, td {
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            transition: background var(--transition-fast);
        }

        th {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #F0ECE6 100%);
            color: var(--accent-dark);
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th:first-child {
            border-top-left-radius: 16px;
        }

        th:last-child {
            border-top-right-radius: 16px;
        }

        tr:hover {
            background: linear-gradient(90deg, transparent 0%, rgba(139, 115, 85, 0.03) 50%, transparent 100%);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:last-child td:first-child {
            border-bottom-left-radius: 16px;
        }

        tr:last-child td:last-child {
            border-bottom-right-radius: 16px;
        }

        /* Улучшенный chart container */
        .chart-container {
            margin: 28px 0;
            background: white;
            padding: 32px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .chart-container h3 {
            margin-bottom: 24px;
            color: var(--accent-dark);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* Премиальные карточки менеджеров */
        .manager-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all var(--transition-base);
            position: relative;
            overflow: hidden;
        }

        .manager-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--accent-primary) 0%, var(--accent-dark) 100%);
            transform: scaleY(0);
            transition: transform var(--transition-base);
        }

        .manager-card:hover::before {
            transform: scaleY(1);
        }

        .manager-card:hover {
            border-color: var(--accent-primary);
            transform: translateX(8px);
            box-shadow: var(--shadow-md);
            background: linear-gradient(90deg, rgba(139, 115, 85, 0.02) 0%, white 20%);
        }

        .manager-card h3 {
            color: var(--accent-dark);
            margin-bottom: 14px;
            font-size: 20px;
            font-weight: 700;
        }

        .manager-stats {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .manager-stats span {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Улучшенный search box */
        .search-box {
            width: 100%;
            padding: 18px 24px;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 16px;
            margin-bottom: 24px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            color: var(--text-primary);
            background: white;
            transition: all var(--transition-base);
            box-shadow: var(--shadow-xs);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-md), 0 0 0 3px rgba(139, 115, 85, 0.1);
            transform: translateY(-2px);
        }

        /* Анимированный loader */
        .loading {
            text-align: center;
            padding: 60px 40px;
            color: var(--accent-primary);
        }

        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        /* Улучшенная expand кнопка */
        .expand-btn {
            margin-top: 20px;
            padding: 14px 28px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            transition: all var(--transition-base);
            font-size: 15px;
            letter-spacing: 0.3px;
        }

        .expand-btn:hover {
            background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-brown) 100%);
            color: white;
            border-color: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }

        /* Премиальные badges */
        .badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow: var(--shadow-xs);
        }

        .badge-success {
            background: linear-gradient(135deg, var(--success-bg) 0%, #C8E6C9 100%);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .badge-danger {
            background: linear-gradient(135deg, var(--danger-bg) 0%, #FFCDD2 100%);
            color: var(--danger-text);
            border: 1px solid var(--danger-border);
        }

        .badge-warning {
            background: linear-gradient(135deg, var(--warning-bg) 0%, #FFE0B2 100%);
            color: var(--warning-text);
            border: 1px solid #FFB74D;
        }

        /* Улучшенные booking items */
        .booking-item {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 2px solid var(--border-color);
            transition: all var(--transition-base);
            box-shadow: var(--shadow-xs);
        }

        .booking-item:hover {
            border-color: var(--accent-light);
            box-shadow: var(--shadow-sm);
            transform: translateY(-2px);
        }

        .booking-item h4 {
            color: var(--accent-dark);
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .booking-item p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 8px 0;
            font-weight: 500;
            line-height: 1.6;
        }

        .booking-item p strong {
            color: var(--text-primary);
            font-weight: 700;
        }

        /* Улучшенное отображение паспортов */
        .passport-image {
            width: 100%;
            max-width: 400px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            margin: 16px 0;
            object-fit: cover;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-base);
        }

        .passport-image:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-md);
        }

        /* Section headers */
        h2 {
            color: var(--accent-dark);
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
            position: relative;
            padding-bottom: 12px;
        }

        h2::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary) 0%, var(--accent-light) 100%);
            border-radius: 2px;
        }

        h3 {
            color: var(--accent-dark);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin: 24px 0 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .app-header {
                padding: 32px 24px;
            }

            .app-header h1 {
                font-size: 32px;
            }

            .header {
                padding: 20px;
            }

            .content-section {
                padding: 24px 20px;
            }

            .stat-card {
                padding: 24px 20px;
            }

            .stat-card .value {
                font-size: 36px;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                width: 100%;
                text-align: center;
            }

            .manager-stats {
                flex-direction: column;
                gap: 12px;
            }

            h2 {
                font-size: 24px;
            }
        }

        /* Дополнительные визуальные улучшения */
        .manager-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        /* Плавная прокрутка */
        * {
            scroll-behavior: smooth;
        }

        /* Скрываем scrollbar но оставляем функциональность */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: var(--accent-light);
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HICKMET PREMIUM HEADER -->
        <div class="app-header">
            <h1>Hickmet Premium</h1>
            <p>Административная панель управления</p>
        </div>

        <!-- TABS -->
        <div class="header">
            <div class="tabs">
                <button class="tab active" onclick="showTab('overview')">Общая статистика</button>
                <button class="tab" onclick="showTab('managers')">Менеджеры</button>
            </div>
        </div>

        <div class="quick-actions">
        </div>

        <!-- ОБЩАЯ СТАТИСТИКА -->
        <div id="overview" class="content-section active">
            <h2>Статистика продаж</h2>

            <div class="date-selector">
                <input type="date" id="start-date" />
                <input type="date" id="end-date" />
                <button class="btn" onclick="loadAnalytics()">Загрузить</button>
                <button class="btn btn-secondary" onclick="setQuickPeriod('today')">Сегодня</button>
                <button class="btn btn-secondary" onclick="setQuickPeriod('week')">Неделя</button>
                <button class="btn btn-secondary" onclick="setQuickPeriod('month')">Месяц</button>
            </div>

            <div class="stats-grid" id="main-stats">
                <!-- Динамически заполняется -->
            </div>

            <div class="chart-container">
                <h3>Динамика продаж</h3>
                <canvas id="salesChart"></canvas>
            </div>

            <div class="table-container">
                <h3 style="margin: 20px; color: var(--accent-dark);">ТОП - Продаваемых Пакетов</h3>
                <div id="top-packages-container" style="max-height: 400px; overflow-y: auto;">
                    <!-- Таблица пакетов -->
                </div>
            </div>

            <div class="table-container">
                <h3 style="margin: 20px; color: var(--accent-dark);">Рейтинг менеджеров</h3>
                <table id="managers-rating">
                    <!-- Таблица менеджеров -->
                </table>
            </div>
        </div>

        <!-- МЕНЕДЖЕРЫ -->
        <div id="managers" class="content-section">
            <h2>Менеджеры</h2>

            <div id="managers-list">
                <!-- Список менеджеров -->
            </div>

            <div id="manager-detail" style="display: none;">
                <div class="manager-actions">
                    <button class="btn btn-secondary" onclick="closeManagerDetail()">← Назад к списку</button>
                    <button class="btn" id="open-history-btn" onclick="openManagerHistory()" disabled>История менеджера</button>
                </div>
                <div id="manager-detail-content"></div>
            </div>
        </div>

        <!-- ПОИСК ПАКЕТОВ -->
        <div id="packages" class="content-section">
            <h2>Поиск пакетов по дате</h2>

            <div class="date-selector">
                <input type="text" id="package-search-date" placeholder="Введите дату (ДД.ММ)" />
                <button class="btn" onclick="searchPackages()">Найти</button>
            </div>

            <div id="packages-results">
                <!-- Результаты поиска -->
            </div>
        </div>

    </div>

    <script>
        // Telegram WebApp инициализация
        const tg = window.Telegram.WebApp;
        tg.expand();

        // API базовый URL (из общего конфига)
        const API_BASE = window.BULL_API_URL;
        const HISTORY_WEBAPP_URL = 'https://ph1lomelaa.github.io/book/history_v2.html';
        const SEARCH_WEBAPP_URL = 'https://ph1lomelaa.github.io/book/search-pilgrim.html';

        let salesChart = null;
        let allBookingsData = [];
        let currentStatusFilter = 'all';
        let currentManagerId = null;

        // Обёртка для fetch с заголовками ngrok
        async function apiFetch(url, options = {}) {
            const headers = {
                'ngrok-skip-browser-warning': '1',
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        }

        // Переключение табов
        function showTab(tabName) {
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Загрузка данных при переключении
            if (tabName === 'managers') {
                loadManagers();
            }
        }

        // Установка быстрых периодов
        function setQuickPeriod(period) {
            const today = new Date();
            const endDate = today.toISOString().split('T')[0];
            let startDate;

            if (period === 'today') {
                startDate = endDate;
            } else if (period === 'week') {
                const weekAgo = new Date(today);
                weekAgo.setDate(today.getDate() - 7);
                startDate = weekAgo.toISOString().split('T')[0];
            } else if (period === 'month') {
                const monthAgo = new Date(today);
                monthAgo.setMonth(today.getMonth() - 1);
                startDate = monthAgo.toISOString().split('T')[0];
            }

            document.getElementById('start-date').value = startDate;
            document.getElementById('end-date').value = endDate;

            loadAnalytics();
        }

        // Загрузка аналитики
        async function loadAnalytics() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            if (!startDate || !endDate) {
                tg.showAlert('Выберите период!');
                return;
            }

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/analytics?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();

                if (data.ok) {
                    renderStats(data);
                    renderChart(data.daily_dynamics);
                    renderTopPackages(data.top_packages);
                    renderManagersRating(data.managers_rating);
                } else {
                    tg.showAlert('Ошибка загрузки данных');
                }
            } catch (error) {
                console.error(error);
                tg.showAlert('Ошибка соединения');
            }
        }

        // Отрисовка статистики
        function renderStats(data) {
            const container = document.getElementById('main-stats');
            container.innerHTML = `
                <div class="stat-card">
                    <h3>Всего продаж</h3>
                    <div class="value">${data.total_bookings}</div>
                </div>
                <div class="stat-card variant-2">
                    <h3>Отменено</h3>
                    <div class="value">${data.total_cancelled}</div>
                </div>
                <div class="stat-card variant-3">
                    <h3>% Отмен</h3>
                    <div class="value">${data.cancellation_rate}%</div>
                </div>
            `;
        }

        // Отрисовка графика
        function renderChart(dynamics) {
            const ctx = document.getElementById('salesChart').getContext('2d');

            if (salesChart) {
                salesChart.destroy();
            }

            const labels = dynamics.map(d => d[0]);
            const values = dynamics.map(d => d[1]);

            salesChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Продажи',
                        data: values,
                        borderColor: '#8B7355',
                        backgroundColor: 'rgba(139, 115, 85, 0.1)',
                        tension: 0.4,
                        fill: true,
                        borderWidth: 3,
                        pointBackgroundColor: '#8B7355',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: 'rgba(45, 42, 38, 0.95)',
                            padding: 12,
                            cornerRadius: 8,
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: 'rgba(139, 115, 85, 0.3)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(232, 227, 220, 0.5)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    }
                }
            });
        }

        // ТОП пакетов
        function renderTopPackages(packages) {
            const container = document.getElementById('top-packages-container');
            const top10 = packages.slice(0, 10);

            let html = '<table><thead><tr><th>Пакет</th><th>Продаж</th></tr></thead><tbody>';
            top10.forEach(([name, count]) => {
                html += `<tr><td>${name}</td><td><strong>${count}</strong></td></tr>`;
            });
            html += '</tbody></table>';

            container.innerHTML = html;
        }

        // Рейтинг менеджеров
        function renderManagersRating(managers) {
            const table = document.getElementById('managers-rating');

            let html = '<thead><tr><th>Менеджер</th><th>Продаж</th><th>Отменено</th></tr></thead><tbody>';
            managers.forEach(([name, total, cancelled]) => {
                html += `<tr><td>${name}</td><td><strong>${total}</strong></td><td style="color: var(--danger-text);">${cancelled}</td></tr>`;
            });
            html += '</tbody></table>';

            table.innerHTML = html;
        }

        // Загрузка списка менеджеров
        async function loadManagers() {
            const container = document.getElementById('managers-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div><p>Загрузка...</p></div>';

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/managers`);
                const data = await response.json();

                if (data.ok) {
                    const cards = data.managers.map(manager => `
                        <div class="manager-card" onclick="showManagerDetail(${manager.telegram_id}, '${manager.full_name}')">
                            <h3>${manager.full_name}</h3>
                            <div class="manager-stats">
                                <span>📱 ID: ${manager.telegram_id}</span>
                                <span>👤 Роль: ${manager.role}</span>
                            </div>
                        </div>
                    `).join('');
                    container.innerHTML = cards || '<p style="color: var(--text-secondary);">Менеджеры не найдены</p>';
                } else {
                    container.innerHTML = '<p>Ошибка загрузки</p>';
                }
            } catch (error) {
                container.innerHTML = '<p>Ошибка загрузки</p>';
            }
        }

        // Детали менеджера
        async function showManagerDetail(managerId, managerName) {
            document.getElementById('managers-list').style.display = 'none';
            document.getElementById('manager-detail').style.display = 'block';
            currentManagerId = managerId;
            const historyBtn = document.getElementById('open-history-btn');
            if (historyBtn) historyBtn.disabled = false;

            const endDateObj = new Date();
            const startDateObj = new Date(endDateObj);
            startDateObj.setMonth(endDateObj.getMonth() - 1);
            const startDate = startDateObj.toISOString().split('T')[0];
            const endDate = endDateObj.toISOString().split('T')[0];

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/manager/${managerId}?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();

                if (data.ok) {
                    let html = `
                        <h2>${managerName}</h2>
                        <div class="stats-grid">
                            <div class="stat-card">
                                <h3>Всего броней</h3>
                                <div class="value">${data.total}</div>
                            </div>
                            <div class="stat-card variant-2">
                                <h3>Активных</h3>
                                <div class="value">${data.active}</div>
                            </div>
                            <div class="stat-card variant-3">
                                <h3>Отменено</h3>
                                <div class="value">${data.cancelled}</div>
                            </div>
                        </div>

                        <h3>История броней:</h3>
                    `;

                    data.bookings.forEach(booking => {
                        const statusBadge = booking.status === 'cancelled' ?
                            '<span class="badge badge-danger">Отменено</span>' :
                            '<span class="badge badge-success">Активно</span>';

                        const createdDate = booking.created_at ? new Date(booking.created_at).toLocaleDateString('ru-RU') : '-';
                        const passportImage = booking.passport_image_path
                            ? `<img src="${API_BASE}/api/care/passport-photo/${booking.id}?ngrok-skip-browser-warning=1" class="passport-image" alt="Паспорт" onerror="this.style.display='none'">`
                            : '';

                        html += `
                            <div class="booking-item">
                                <h4>${booking.guest_last_name} ${booking.guest_first_name}</h4>
                                ${passportImage}
                                <p><strong>Пакет:</strong> ${booking.package_name}</p>
                                <p><strong>Лист:</strong> ${booking.sheet_name}</p>
                                <p><strong>Цена:</strong> ${booking.price} тг | ${statusBadge}</p>
                                <p style="font-size: 12px; color: var(--text-secondary);">Создано: ${createdDate}</p>
                            </div>
                        `;
                    });

                    document.getElementById('manager-detail-content').innerHTML = html;
                }
            } catch (error) {
                console.error(error);
            }
        }

        function openManagerHistory(managerIdOverride) {
            const managerId = managerIdOverride || currentManagerId;
            if (!managerId) {
                tg.showAlert('Сначала выберите менеджера');
                return;
            }
            const url = `${HISTORY_WEBAPP_URL}?managerId=${managerId}`;
            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function openPilgrimSearch() {
            const url = SEARCH_WEBAPP_URL;
            if (tg && typeof tg.openLink === 'function') {
                tg.openLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        function closeManagerDetail() {
            document.getElementById('managers-list').style.display = 'block';
            document.getElementById('manager-detail').style.display = 'none';
            currentManagerId = null;
            const historyBtn = document.getElementById('open-history-btn');
            if (historyBtn) historyBtn.disabled = true;
        }

        // Поиск пакетов
        async function searchPackages() {
            const dateStr = document.getElementById('package-search-date').value;
            if (!dateStr) {
                tg.showAlert('Введите дату!');
                return;
            }

            try {
                const response = await apiFetch(`${API_BASE}/api/admin/search/packages?date=${dateStr}`);
                const data = await response.json();

                if (data.ok) {
                    let html = '<h3>Результаты поиска:</h3>';

                    if (data.packages.length === 0) {
                        html += '<p style="color: var(--text-secondary);">Пакеты не найдены</p>';
                    } else {
                        data.packages.forEach(pkg => {
                            html += `
                                <div class="booking-item">
                                    <h4>${pkg.package_name}</h4>
                                    <p><strong>Лист:</strong> ${pkg.sheet_name}</p>
                                    <p><strong>Продано:</strong> ${pkg.count}</p>
                                </div>
                            `;
                        });
                    }

                    document.getElementById('packages-results').innerHTML = html;
                }
            } catch (error) {
                tg.showAlert('Ошибка поиска');
            }
        }

        // Показываем полный список найденных пакетов (без обрезки)
        let lastPackages = [];

        // Сохраняем результаты поиска
        const originalSearchPackages = searchPackages;
        searchPackages = async function() {
            await originalSearchPackages();
            const container = document.getElementById('packages-results');
            const cards = container.querySelectorAll('.booking-item');
            if (cards.length) {
                lastPackages = Array.from(cards).map(card => card.outerHTML).join('');
            }
        };

        function expandPackages() {
            const container = document.getElementById('packages-results');
            if (!lastPackages || lastPackages.length === 0) {
                tg.showAlert('Сначала выполните поиск по дате');
                return;
            }
            container.innerHTML = `<div class="bookings-container">${lastPackages}</div>`;
        }

        // Инициализация при загрузке
        window.addEventListener('load', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('start-date').value = today;
            document.getElementById('end-date').value = today;

            setQuickPeriod('today');
        });
    </script>
</body>
</html>
