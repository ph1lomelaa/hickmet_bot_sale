<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hickmet Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            /* Элегантная бежево-коричневая палитра */
            --bg-primary: #FAF8F5;
            --bg-secondary: #F5F1EB;
            --bg-card: #FFFFFF;
            --accent-brown: #9B8474;
            --accent-dark: #6B5D52;
            --accent-light: #C4B5A7;
            --text-primary: #3D3935;
            --text-secondary: #8A827C;
            --border-color: #E8E3DC;
            --shadow-soft: 0 4px 12px rgba(107, 93, 82, 0.08);
            --shadow-medium: 0 8px 24px rgba(107, 93, 82, 0.12);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            padding: 20px;
            padding-bottom: 60px;
            min-height: 100vh;
        }
        
        .app-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .app-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent-dark);
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .app-header p {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .step {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .step.active {
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: white;
            border-color: var(--accent-dark);
            box-shadow: 0 4px 12px rgba(107, 93, 82, 0.3);
        }

        .step.completed {
            background: #E8F5E9;
            border-color: #2E7D32;
            color: #2E7D32;
        }
        
        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-brown);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        select, input, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            background-color: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 4px rgba(107, 93, 82, 0.04);
        }
        
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-brown);
            background-color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(155, 132, 116, 0.15);
            transform: translateY(-1px);
        }
        
        .row {
            display: flex;
            gap: 12px;
        }
        
        .col {
            flex: 1;
        }
        
        .manager-control {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .manager-control select,
        .manager-control input {
            flex: 1;
        }
        
        .name-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .name-row .name-input {
            flex: 1;
            font-size: 14px;
        }

        .name-hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .gender-select {
            margin-top: 10px;
            font-size: 14px;
        }

        /* Чекбоксы INF/CHD */
        .passenger-type-checkboxes {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .passenger-type-checkboxes label {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-transform: none;
            letter-spacing: 0;
            margin: 0;
            padding: 0;
        }

        .passenger-type-checkboxes input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .passenger-type-checkboxes span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            line-height: 1;
        }

        .passenger-type-checkboxes input[type="checkbox"]:checked + span {
            border-color: var(--accent-brown);
            background: rgba(155, 132, 116, 0.10);
            color: var(--accent-dark);
        }

        .passenger-type-checkboxes label:hover span {
            border-color: var(--accent-light);
            color: var(--accent-brown);
        }
        
        /* Стилизованные радио-кнопки */
        .city-buttons, .radio-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        
        .city-buttons input, .radio-group input {
            display: none;
        }
        
        .city-buttons label, .radio-group label {
            flex: 1;
            padding: 14px 20px;
            text-align: center;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            margin: 0;
            text-transform: none;
            letter-spacing: 0;
            box-shadow: var(--shadow-soft);
        }
        
        .city-buttons label:hover, .radio-group label:hover {
            border-color: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }
        
        .city-buttons input:checked + label, .radio-group input:checked + label {
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: white;
            border-color: var(--accent-dark);
            box-shadow: 0 6px 16px rgba(107, 93, 82, 0.25);
        }
        .edit-notice {
            display: none;
            margin: 12px 0;
            padding: 12px 14px;
            border-radius: 10px;
            background: #FFF5E0;
            color: #8A5B00;
            border: 1px solid #FFD18C;
            font-size: 14px;
            font-weight: 600;
        }
        
        /* Карточки паломников */
        .tourist-card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-soft);
            transition: all 0.3s ease;
        }
        
        .tourist-card:hover {
            box-shadow: var(--shadow-medium);
            border-color: var(--accent-light);
        }
        
        .tourist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .tourist-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-dark);
        }
        
        .passport-btn {
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(107, 93, 82, 0.2);
        }
        
        .passport-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(107, 93, 82, 0.3);
        }
        
        .passport-btn:active {
            transform: translateY(0);
        }
        
        /* Кнопки действий */
        .submit-btn {
            width: 100%;
            padding: 18px;
            margin-top: 24px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(107, 93, 82, 0.25);
            letter-spacing: 0.5px;
        }
        
        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(107, 93, 82, 0.35);
        }
        
        .submit-btn:active {
            transform: translateY(-1px);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Smart box */
        .smart-box {
            background: linear-gradient(135deg, #FFFFFF 0%, var(--bg-secondary) 100%);
            padding: 20px;
            border-radius: 18px;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: var(--shadow-medium);
        }
        
        .smart-box h3 {
            color: var(--accent-dark);
            margin-bottom: 16px;
            font-size: 20px;
            font-weight: 700;
        }
        
        /* Данные паспорта */
        .passport-data {
            background: linear-gradient(135deg, #E8F5E9 0%, #F1F8E9 100%);
            padding: 14px;
            border-radius: 12px;
            margin-top: 12px;
            border: 2px solid #C8E6C9;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .phone-input {
            margin-top: 8px;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .passport-data.visible {
            display: block;
        }
        
        .passport-field {
            font-size: 14px;
            margin: 6px 0;
            color: var(--text-primary);
            display: flex;
            padding: 6px 0;
            border-bottom: 1px solid rgba(139, 115, 85, 0.1);
        }
        
        .passport-field:last-child {
            border-bottom: none;
        }
        
        .passport-field strong {
            color: #2E7D32;
            min-width: 150px;
            font-weight: 600;
        }
        
        /* Details/Summary */
        details {
            margin-top: 20px;
            background: var(--bg-card);
            padding: 8px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-soft);
        }
        
        summary {
            font-weight: 700;
            padding: 14px;
            cursor: pointer;
            color: var(--accent-dark);
            font-size: 15px;
            border-radius: 10px;
            transition: all 0.3s ease;
            list-style: none;
        }
        
        summary:hover {
            background: var(--bg-secondary);
        }
        
        summary::-webkit-details-marker {
            display: none;
        }
        
        summary::before {
            content: "📂 ";
            margin-right: 8px;
        }
        
        details[open] summary::before {
            content: "📂 ";
        }
        
        details > div {
            padding: 14px;
        }
        
        /* Поиск даты */
        .date-search {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }
        
        .date-search input {
            flex: 1;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
        }
        
        .search-btn {
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: white;
            border-radius: 12px;
            padding: 0 24px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(107, 93, 82, 0.2);
            white-space: nowrap;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(107, 93, 82, 0.3);
        }

        /* Список пакетов */
        .package-panel {
            margin-top: 12px;
            padding: 14px;
            border-radius: 16px;
            border: 2px solid var(--border-color);
            background: linear-gradient(180deg, #FFFFFF 0%, var(--bg-secondary) 100%);
            box-shadow: var(--shadow-soft);
        }

        .package-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .package-count {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-dark);
            letter-spacing: 0.3px;
        }

        .package-filter {
            flex: 1;
            min-width: 180px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: #FFFFFF;
            font-size: 13px;
            box-shadow: none;
        }

        .package-list {
            margin-top: 12px;
            display: grid;
            gap: 10px;
            max-height: 320px;
            overflow: auto;
            padding-right: 4px;
        }

        .package-card {
            border: 2px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 14px;
            background: #FFFFFF;
            box-shadow: var(--shadow-soft);
            cursor: pointer;
            transition: all 0.25s ease;
            animation: packageIn 0.25s ease forwards;
            animation-delay: var(--delay, 0s);
            opacity: 0;
            transform: translateY(4px);
        }

        .package-card:hover {
            border-color: var(--accent-light);
            box-shadow: var(--shadow-medium);
            transform: translateY(-2px);
        }

        .package-card.is-active {
            border-color: var(--accent-dark);
            background: linear-gradient(135deg, var(--accent-brown) 0%, var(--accent-dark) 100%);
            color: #FFFFFF;
        }

        .package-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: 0.2px;
        }

        .package-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .package-chip {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 999px;
            background: rgba(155, 132, 116, 0.12);
            border: 1px solid rgba(155, 132, 116, 0.25);
            color: var(--accent-dark);
        }

        .package-card.is-active .package-chip {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            color: #FFFFFF;
        }

        .package-empty {
            margin-top: 10px;
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            background: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .package-panel.is-locked {
            opacity: 0.75;
        }

        .package-panel.is-locked .package-card {
            pointer-events: none;
        }

        @keyframes packageIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Кнопка "Назад" */
        .back-btn {
            width: 100%;
            background: none;
            border: 2px solid var(--border-color);
            color: var(--text-secondary);
            margin-top: 12px;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            border-color: var(--accent-light);
            color: var(--accent-brown);
            background: var(--bg-secondary);
        }
        
        /* Анимации загрузки */
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        /* Иконки в тексте */
        .icon {
            display: inline-block;
            margin-right: 6px;
        }

        .start-box {
            margin-top: 16px;
        }

        .choice-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .choice-row button {
            flex: 1;
        }

        .sub-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            background: var(--bg-card);
            cursor: pointer;
            font-weight: 700;
            color: var(--accent-dark);
            transition: all 0.2s ease;
        }

        .sub-btn:hover {
            border-color: var(--accent-light);
            transform: translateY(-1px);
        }

        .dropzone {
            margin-top: 12px;
            padding: 16px;
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.6);
            text-align: center;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .dropzone.dragover {
            border-color: var(--accent-brown);
            background: rgba(155, 132, 116, 0.08);
            color: var(--accent-dark);
        }

        .file-list {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-card);
            margin-top: 6px;
        }

	        .file-status {
	            font-weight: 700;
	            color: var(--accent-dark);
	            white-space: nowrap;
	        }

	        .file-actions {
	            display: flex;
	            align-items: center;
	            gap: 12px;
	        }

	        .file-remove {
	            border: none;
	            background: none;
	            padding: 0;
	            cursor: pointer;
	            font-weight: 700;
	            font-size: 13px;
	            color: #B42318;
	            text-decoration: underline;
	        }

	        .file-remove:disabled {
	            opacity: 0.5;
	            cursor: not-allowed;
	            text-decoration: none;
	        }

		        .help-text {
		            margin-top: 10px;
		            font-size: 13px;
		            color: var(--text-secondary);
		            line-height: 1.35;
		        }

		        .passport-warning {
		            margin-top: 10px;
		            padding: 10px 12px;
		            border-radius: 12px;
		            border: 1px solid #FFD18C;
		            background: #FFF5E0;
		            color: #8A5B00;
		            font-size: 13px;
		            font-weight: 700;
		            line-height: 1.35;
		        }

		        .passport-warning.danger {
		            border-color: #FDA29B;
		            background: #FEF3F2;
		            color: #B42318;
		        }

		        .file-warning {
		            margin-top: 6px;
		            font-size: 12px;
		            font-weight: 700;
		            color: #8A5B00;
		            line-height: 1.35;
		        }

		        .file-warning.danger {
		            color: #B42318;
		        }
	    </style>
</head>
<body>

<div class="app-header">
    <h1>Бронирование Умры</h1>
</div>
<div id="edit_notice" class="edit-notice">
    Режим редактирования: пакет и дата зафиксированы, можно менять только данные паломника.
</div>

<div id="step_0" style="display: none;">
    <div class="smart-box start-box">
        <h3>Создать бронь</h3>
        <button class="submit-btn" id="create_booking_btn" type="button">Создать бронь</button>

        <div id="create_flow" style="display: none; margin-top: 14px;">
            <label>Количество паломников:</label>
            <input type="number" id="pilgrims_count_input" min="1" max="30" placeholder="Например: 5">

            <div class="choice-row">
                <button class="sub-btn" id="fill_tg_btn" type="button">Заполнить в Telegram</button>
                <button class="sub-btn" id="fill_form_btn" type="button">Заполнить в форме</button>
            </div>

            <div id="form_passport_block" style="display:none; margin-top: 14px;">
                <label>Паспорта:</label>
                <div class="choice-row">
                    <button class="sub-btn" id="passports_all_btn" type="button">Все паспорта есть</button>
                    <button class="sub-btn" id="passports_partial_btn" type="button">Частичные паспорта</button>
                </div>

                <div class="dropzone" id="passport_dropzone">
                    Перетащите паспорта сюда (jpg/png/pdf) или нажмите «Выбрать файлы»
                    <div style="margin-top:10px;">
                        <button class="sub-btn" id="choose_files_btn" type="button">Выбрать файлы</button>
                        <input type="file" id="passports_files_input" accept=".jpg,.jpeg,.png,.pdf" multiple style="display:none;">
                    </div>
                </div>

                <div class="file-list" id="files_list"></div>

                <button class="submit-btn" id="start_processing_btn" type="button" style="margin-top: 14px;" disabled>
                    Начать обработку
                </button>
            </div>
        </div>
    </div>
</div>

<div id="step_1">
    <div class="step-indicator">
        <div class="step active">1</div>
        <div class="step">2</div>
    </div>

    <div class="smart-box">
        <label><span class="icon"></span>1. Дата вылета:</label>
        <div class="date-search">
            <input type="text" id="date_input" placeholder="13.12">
            <button type="button" onclick="handleSearch()" class="search-btn">Найти</button>
        </div>

        <label style="margin-top: 16px;"><span class="icon"></span>2. Пакет:</label>
        <select id="pkg_name" disabled>
            <option value="">Сначала введите дату</option>
        </select>

        <div class="package-panel" id="package_panel" style="display: none;">
            <div class="package-toolbar">
                <div class="package-count" id="pkg_count">Пакеты</div>
                <input type="text" id="pkg_filter" class="package-filter" placeholder="Фильтр по названию">
            </div>
            <div class="package-list" id="pkg_list" role="listbox" aria-label="Список пакетов"></div>
            <div class="package-empty" id="pkg_empty" style="display: none;">Пакеты не найдены</div>
        </div>
    </div>

    <input type="hidden" id="sheet_name_hidden">
    <input type="hidden" id="table_id_hidden">

    const MANAGER_NAMES = [

    let packageCache = [];

    function renderManagerOptions() {
        const options = ['<option value="">Выберите менеджера</option>',
            ...MANAGER_NAMES.map(name => `<option value="${name}">${name}</option>`),
            '<option value="other">(Другое)</option>'
        ];
        managerSelect.innerHTML = options.join('');
    }

    function syncManagerValue() {
        if (managerSelect.value === 'other') {
            managerCustomInput.style.display = 'block';
            managerHiddenInput.value = managerCustomInput.value;
            managerCustomInput.focus();
        } else {
            managerCustomInput.style.display = 'none';
            managerCustomInput.value = '';
            managerHiddenInput.value = managerSelect.value;
        }
    }

    function splitPackageName(name) {
        const raw = (name || '').trim();
        if (!raw) return { title: '', context: '' };
        const idx = raw.lastIndexOf('[');
        if (idx > 0 && raw.endsWith(']')) {
            return {
                title: raw.slice(0, idx).trim(),
                context: raw.slice(idx + 1, -1).trim()
            };
        }
        return { title: raw, context: '' };
    }

    function shouldSkipPackage(name) {
        const { title } = splitPackageName(name);
        if (!title) return true;

        const raw = title.trim().toUpperCase();
        const dateRangeRx = /^\d{1,2}[./]\d{1,2}\s*[-–—]\s*\d{1,2}[./]\d{1,2}\s*/;
        const dateRx = /^\d{1,2}[./]\d{1,2}\s*/;
        const hasDatePrefix = dateRangeRx.test(raw) || dateRx.test(raw);

        // Убираем ведущие даты/диапазоны дат, чтобы фильтр работал по маршруту
        const normalized = raw.replace(dateRangeRx, '').replace(dateRx, '');

        // Эти префиксы скрываем всегда
        const alwaysBlocked = ['ALA-JED', 'BUS', 'JED', 'ALA', 'MAD', 'NQZ'];
        if (alwaysBlocked.some(prefix => normalized.startsWith(prefix))) return true;

        // HIKMA/NIYET скрываем только если НЕТ даты в начале
        const blockedWithoutDate = ['HIKMA', 'NIYET'];
        if (!hasDatePrefix && blockedWithoutDate.some(prefix => normalized.startsWith(prefix))) return true;

        return false;
    }

    function highlightPackage(value) {
        if (!pkgList) return;
        pkgList.querySelectorAll('.package-card').forEach(card => {
            card.classList.toggle('is-active', card.dataset.value === value);
        });
    }

    function renderPackageList(items, selectedValue) {
        if (!pkgPanel || !pkgList || !pkgCount || !pkgEmpty) return;

        pkgPanel.style.display = 'block';
        const list = items || [];
        pkgCount.textContent = list.length ? `Найдено пакетов: ${list.length}` : 'Пакеты';

        pkgList.innerHTML = '';
        if (!list.length) {
            pkgEmpty.style.display = 'block';
            pkgList.style.display = 'none';
            return;
        }

        pkgEmpty.style.display = 'none';
        pkgList.style.display = 'grid';

        const frag = document.createDocumentFragment();
        list.forEach((item, idx) => {
            const card = document.createElement('div');
            card.className = 'package-card';
            card.dataset.value = item.n;
            if (item.n === selectedValue) card.classList.add('is-active');
            card.style.setProperty('--delay', `${Math.min(idx, 8) * 0.03}s`);

            const { title, context } = splitPackageName(item.n);
            const meta = [];
            if (context) {
                meta.push(`Источник: ${context}`);
            } else if (item.s) {
                meta.push(`Лист: ${item.s}`);
            }
            if (item.d) {
                meta.push(`Дата: ${item.d}`);
            }

            card.innerHTML = `
                <div class="package-title">${title}</div>
                ${meta.length ? `<div class="package-meta">${meta.map(m => `<span class="package-chip">${m}</span>`).join('')}</div>` : ''}
            `;

            card.addEventListener('click', () => {
                if (pkgSelect) {
                    pkgSelect.value = item.n;
                    pkgSelect.dispatchEvent(new Event('change'));
                }
                highlightPackage(item.n);
            });

            frag.appendChild(card);
        });
        pkgList.appendChild(frag);
    }

    function setPackagePanelLocked(isLocked) {
        if (!pkgPanel || !pkgFilter) return;
        pkgPanel.classList.toggle('is-locked', isLocked);
        pkgFilter.disabled = isLocked;
    }

    function setManagerName(name) {
        if (!name) {
            managerSelect.value = '';
            syncManagerValue();
            return;
        }
        if (MANAGER_NAMES.includes(name)) {
            managerSelect.value = name;
            syncManagerValue();
        } else {
            managerSelect.value = 'other';
            managerCustomInput.style.display = 'block';
            managerCustomInput.value = name;
            managerHiddenInput.value = name;
        }
    }

    managerSelect.addEventListener('change', () => {
        syncManagerValue();
    });

    managerCustomInput.addEventListener('input', () => {
        if (managerSelect.value === 'other') {
            managerHiddenInput.value = managerCustomInput.value;
        }
    });

    renderManagerOptions();

    if (pkgFilter) {
        pkgFilter.addEventListener('input', () => {
            const query = (pkgFilter.value || '').trim().toLowerCase();
            const filtered = packageCache.filter(item => (item.n || '').toLowerCase().includes(query));
            renderPackageList(filtered, pkgSelect ? pkgSelect.value : '');
        });
    }

    // --- ПОИСК ПАКЕТОВ ---
    async function handleSearch() {
        let date = document.getElementById('date_input').value.trim().replace(/[\/\s,]/g, '.');
        document.getElementById('date_input').value = date;

        if (date.length < 5) return alert("Введите дату полностью (напр. 13.12)");

        const sel = pkgSelect || document.getElementById('pkg_name');
        sel.innerHTML = '<option class="loading">⏳ Поиск пакетов...</option>';
        if (pkgFilter) pkgFilter.value = '';
        setPackagePanelLocked(false);
        renderPackageList([], '');

        try {
            const r = await fetch(`${API_URL}/api/packages?date=${date}`, { headers: {"ngrok-skip-browser-warning":"1"} });
            const res = await r.json();

            if (res.found) {
                const filtered = (res.data || []).filter(i => !shouldSkipPackage(i.n));
                if (!filtered.length) {
                    sel.innerHTML = '<option>❌ Нет подходящих пакетов</option>';
                    sel.disabled = true;
                    packageCache = [];
                    renderPackageList([], '');
                    return;
                }

                sel.disabled = false;
                sel.innerHTML = filtered.map(i => `<option value="${i.n}" data-sheet="${i.s}" data-table="${i.t}">${i.n}</option>`).join('');
                sel.value = filtered[0].n;
                document.getElementById('sheet_name_hidden').value = filtered[0].s;
                document.getElementById('table_id_hidden').value = filtered[0].t;
                packageCache = filtered;
                renderPackageList(packageCache, sel.value);
            } else {
                sel.innerHTML = '<option>❌ Нет рейсов</option>';
                sel.disabled = true;
                packageCache = [];
                renderPackageList([], '');
            }
        } catch(e) { alert("Ошибка связи с сервером"); }
    }

    document.getElementById('date_input').addEventListener('input', function() {
        if (currentMode === 'edit') return;
        if (this.value.length === 5) handleSearch();
    });

    document.getElementById('pkg_name').onchange = (e) => {
        if (currentMode === 'edit') return;
        const opt = e.target.options[e.target.selectedIndex];
        document.getElementById('sheet_name_hidden').value = opt.dataset.sheet;
        document.getElementById('table_id_hidden').value = opt.dataset.table;
        highlightPackage(e.target.value);
    };

    const urlParams = new URLSearchParams(window.location.search);
	    const pRaw = urlParams.get('pilgrims');
	    const fillModeParam = (urlParams.get('fill_mode') || '').toLowerCase();
	    const countParam = parseInt((urlParams.get('count') || '').trim() || '0', 10);
		    const managerParam = urlParams.get('manager_name_text');
		    const modeParam = urlParams.get('mode');
		    const editBookingId = urlParams.get('booking_id');
		    const oldBookingId = urlParams.get('old_booking_id');
		    const oldBookingIdsParam = urlParams.get('old_booking_ids');
		    const rescheduleCommentParam = urlParams.get('reschedule_comment');
		    const openDateId = urlParams.get('open_date_id');

    console.log("📥 URL параметры:");
    console.log("   pilgrims:", pRaw ? "есть данные" : "нет");
    console.log("   mode:", modeParam);
    console.log("   booking_id:", editBookingId);
    console.log("   old_booking_id:", oldBookingId);
    console.log("   open_date_id:", openDateId);

		    currentMode = modeParam || localStorage.getItem('mode') || 'create';
		    currentBookingId = editBookingId || localStorage.getItem('edit_booking_id') || null;
		    let currentOldBookingId = oldBookingId || localStorage.getItem('old_booking_id') || null;
		    let currentOldBookingIds = [];

		    // Если пришли в "заполнение в форме" (новая бронь), всегда считаем это созданием,
		    // даже если в URL/LocalStorage остался mode=reschedule.
		    if (fillModeParam === 'form') {
		        currentMode = 'create';
		    }

		    // Если открыли форму без mode=... (обычное создание), не тащим хвосты переноса из localStorage
		    // (иначе UI/комментарии/endpoint могут "думать", что это перенос).
		    if (!modeParam || fillModeParam === 'form') {
		        currentMode = 'create';
		        try {
		            localStorage.removeItem('mode');
		            localStorage.removeItem('is_reschedule');
		            localStorage.removeItem('old_booking_id');
		            localStorage.removeItem('old_booking_ids');
		            localStorage.removeItem('reschedule_comment');
		            localStorage.removeItem('reschedule_data');
		            localStorage.removeItem('old_booking_id');
		        } catch (e) {}
		        currentOldBookingId = null;
		        currentOldBookingIds = [];
		    }
		    try {
		        if (oldBookingIdsParam) {
		            currentOldBookingIds = JSON.parse(oldBookingIdsParam);
		            localStorage.setItem('old_booking_ids', JSON.stringify(currentOldBookingIds));
		        } else {
		            const stored = localStorage.getItem('old_booking_ids');
		            if (stored && currentMode === 'reschedule') currentOldBookingIds = JSON.parse(stored);
		        }
		    } catch (e) {
		        currentOldBookingIds = [];
		    }

		    if (currentMode !== 'reschedule') {
		        currentOldBookingId = null;
		        currentOldBookingIds = [];
		    }

	    // Если комментарий переноса передали через URL — сохраняем (чтобы не потерялся при редиректах)
	    if (rescheduleCommentParam) {
	        localStorage.setItem('reschedule_comment', rescheduleCommentParam);
	    }

    // Предзаполняем менеджера, если его передали в URL (например при переносе)
    if (managerParam) {
        try {
            setManagerName(decodeURIComponent(managerParam));

    function showStep0() {
        document.getElementById('step_0').style.display = 'block';

	    function fileSignature(file) {
	        return `${file.name}::${file.size}::${file.lastModified || 0}`;
	    }

		    function escapeHtml(str) {
		        return String(str)
		            .replaceAll('&', '&amp;')
		            .replaceAll('<', '&lt;')
		            .replaceAll('>', '&gt;')
		            .replaceAll('"', '&quot;')
		            .replaceAll("'", '&#39;');
		    }

		    function getWarningClass(message) {
		        const msg = String(message || '').toLowerCase();
		        if (!msg) return '';
		        if (msg.includes('просроч') || msg.includes('удостовер') || msg.includes('id card')) return 'danger';
		        return '';
		    }

		    function addFiles(files) {
		        const incoming = Array.from(files || []);
		        if (!incoming.length) return;

	        const existing = new Set(passportFiles.map(fileSignature));
        for (const file of incoming) {
            const sig = fileSignature(file);
            if (existing.has(sig)) continue;
            passportFiles.push(file);
            existing.add(sig);
        }

        renderFilesList();
        document.getElementById('start_processing_btn').disabled = passportFiles.length === 0 || processingInProgress;
    }

		    function renderFilesList(statusMap = {}, warningMap = {}) {
		        const list = document.getElementById('files_list');
		        if (!list) return;
		        if (!passportFiles.length) {
		            list.innerHTML = '<div style="margin-top:8px;">Файлы не выбраны</div>';
		            return;
		        }
		        list.innerHTML = passportFiles.map((f, i) => {
		            const status = statusMap[i] || 'Готов';
		            const warning = warningMap[i];
		            const warningClass = warning ? getWarningClass(warning) : '';
		            const disabled = processingInProgress ? 'disabled' : '';
		            return `
		                <div class="file-item">
		                    <div>${i + 1}. ${escapeHtml(f.name)}</div>
		                    ${warning ? `<div class="file-warning ${warningClass}">${escapeHtml(warning)}</div>` : ''}
		                    <div class="file-actions">
		                        <button type="button" class="file-remove" data-idx="${i}" ${disabled}>Отменить</button>
		                        <div class="file-status">${escapeHtml(status)}</div>
		                    </div>
		                </div>
		            `;
		        }).join('');
		    }

    async function uploadPassportFile(file) {
        const formData = new FormData();
        formData.append("file", file);
        const res = await fetch(`${API_URL}/api/passports/upload`, {
            method: "POST",
            body: formData,
            headers: {"ngrok-skip-browser-warning":"1"}
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.ok) throw new Error(json.error || `Ошибка сервера ${res.status}`);
        return json;
    }

	    function buildPilgrimFromParsed(parsed, filename) {
	        const data = parsed?.data || parsed?.parsed_data || {};
	        const firstName = data.first_name || "-";
	        const lastName = data.last_name || "-";
	        const gender = data.gender || "-";
	        const dob = data.date_of_birth || "-";
	        const passportNum = data.passport_num || "-";
	        const expiry = data.passport_expiry || "-";
	        const iin = data.iin || "-";
	        const passportPath = parsed?.path || null;
	        const passportWarning = parsed?.passport_warning || data.passport_warning || null;
	        const displayName = `${lastName !== '-' ? lastName : ''} ${firstName !== '-' ? firstName : ''}`.trim() || '-';

	        return {
	            name: displayName,
	            last_name: lastName,
	            first_name: firstName,
	            phone: "-",
	            passport_num: passportNum,
	            date_of_birth: dob,
	            gender: gender,
	            passport_expiry: expiry,
	            iin: iin,
	            passport_image_path: passportPath,
	            passport_warning: passportWarning,
	            _source_file: filename || "",
	            is_infant: false,
	            is_child: false
	        };
	    }

    async function processAllPassportsAndCreatePilgrims() {
        if (processingInProgress) return;
        if (!creationCount || creationCount < 1) return alert("Укажите количество паломников");
        if (!passportFiles.length) return alert("Выберите файлы паспортов");

	        processingInProgress = true;
	        const statusMap = {};
	        const warningMap = {};
	        const btn = document.getElementById('start_processing_btn');
	        btn.disabled = true;
	        btn.innerHTML = '<span class="icon">⏳</span> Обрабатываю...';

        const results = [];
        try {
	            for (let i = 0; i < passportFiles.length; i++) {
	                statusMap[i] = '⏳';

	                    statusMap[i] = parsed.parsed ? '✅' : '⚠️';
	                    warningMap[i] = parsed.passport_warning || null;
	                } catch (e) {
	                    results.push({ ok: false, file: passportFiles[i], error: String(e?.message || e) });
	                    statusMap[i] = '❌';
	                    warningMap[i] = null;
	                }
	                renderFilesList(statusMap, warningMap);
	            }

            const okResults = results.filter(r => r.ok).map(r => buildPilgrimFromParsed(r.parsed, r.file?.name));

                return;
            }

            const pilgrims = okResults.slice(0, creationCount);
	            while (pilgrims.length < creationCount) {

	                    name: '-',
	                    last_name: '-',
	                    first_name: '-',
	                    phone: '-',
	                    passport_num: '-',

    // Функция для загрузки полных данных брони при редактировании
    async function loadBookingData(bookingId) {
        try {
            console.log("📥 Загрузка данных брони #" + bookingId);
            const res = await fetch(`${API_URL}/api/bookings/${bookingId}`, {
                headers: {"ngrok-skip-browser-warning": "1"}
            });
            const json = await res.json();

            if (!res.ok || !json.ok) {
                throw new Error(json.error || "Ошибка загрузки брони");
            }

            const booking = json.booking;
            console.log("✅ Данные брони получены:", booking);

            // Предзаполняем основные поля формы
            if (booking.package_name) {
                const pkgSelect = document.getElementById('pkg_name');
                pkgSelect.innerHTML = `<option value="${booking.package_name}">${booking.package_name}</option>`;
                pkgSelect.value = booking.package_name;
                pkgSelect.disabled = true;

                packageCache = [{
                    n: booking.package_name,
                    s: booking.sheet_name || '',
                    t: booking.table_id || '',
                    d: ''
                }];
                renderPackageList(packageCache, booking.package_name);
                setPackagePanelLocked(true);
            }

            if (booking.sheet_name) {
                document.getElementById('sheet_name_hidden').value = booking.sheet_name;
                // Извлекаем дату из названия листа (например "JUNE 15.06")
                const dateMatch = booking.sheet_name.match(/(\d{1,2})\.(\d{1,2})/);
                if (dateMatch) {
                    document.getElementById('date_input').value = `${dateMatch[1]}.${dateMatch[2]}`;
                }
            }

            // Город вылета (radio buttons)
            if (booking.departure_city) {
                const cityRadio = document.querySelector(`input[name="departure_city"][value="${booking.departure_city}"]`);
                if (cityRadio) cityRadio.checked = true;
            }

            // Основные поля
            if (booking.price) {
                document.getElementById('price').value = booking.price;
            }

            if (booking.amount_paid) {
                document.getElementById('amount_paid').value = booking.amount_paid;
            }

            if (booking.room_type) {
                document.getElementById('room_type').value = booking.room_type;
            }

            if (booking.meal_type) {
                document.getElementById('meal_type').value = booking.meal_type;
            }

            if (booking.visa_status) {
                document.getElementById('visa_status').value = booking.visa_status;
            }

            if (booking.avia) {
                document.getElementById('avia').value = booking.avia;
            }

            // Дополнительные поля
            if (booking.region) {
                document.getElementById('region').value = booking.region;
            }

            if (booking.contract_number) {
                document.getElementById('contract_number').value = booking.contract_number;
            }

            if (booking.exchange_rate) {
                document.getElementById('exchange_rate').value = booking.exchange_rate;
            }

            if (booking.discount) {
                document.getElementById('discount').value = booking.discount;
            }

            if (booking.source) {
                document.getElementById('source').value = booking.source;
            }

            if (booking.train) {
                document.getElementById('train').value = booking.train;
            }

            // Менеджер и комментарий
            if (booking.manager_name_text) {
                setManagerName(booking.manager_name_text);
            }

            if (booking.comment && booking.comment !== '-') {
                document.getElementById('comment').value = booking.comment;
            }

            // Если есть table_id, сохраняем его
            if (booking.table_id) {
                const tableIdInput = document.getElementById('table_id_hidden');
                if (tableIdInput) {
                    tableIdInput.value = booking.table_id;
                }
            }

            console.log("✅ Все поля формы предзаполнены");
            applyEditLock();
            return booking;
        } catch (e) {
            console.error("❌ Ошибка загрузки данных брони:", e);
            alert("Ошибка загрузки данных брони: " + e.message);
            return null;
        }
    }

        }

        // В режиме редактирования не показываем выбор размещения — сразу сохраняем изменения
        if (currentMode === 'edit') {
            finalSubmit();
            return;
        }

        document.getElementById('step_1').style.display = 'none';
        document.getElementById('step_2').style.display = 'block';
        window.scrollTo(0, 0);

        // Показываем опции группового размещения, если паломников больше 1
        if (pilgrimsData.length > 1) {
            document.getElementById('group_logic').style.display = 'block';
        }

        fetchAvailableRooms();
    }

    function backToStep1() {
        document.getElementById('step_2').style.display = 'none';
        document.getElementById('step_1').style.display = 'block';
        window.scrollTo(0, 0);
    }

    function updateUI() {
        const m = document.querySelector('input[name="place_method"]:checked').value;
        document.getElementById('room_list_div').style.display = m === 'pick' ? 'block' : 'none';
        document.getElementById('manual_div').style.display = m === 'manual' ? 'block' : 'none';
    }

    async function fetchAvailableRooms() {
        const sel = document.getElementById('room_select');
        sel.innerHTML = '<option class="loading">⏳ Загрузка комнат...</option>';

        const params = new URLSearchParams({
            table_id: document.getElementById('table_id_hidden').value,
            sheet_name: document.getElementById('sheet_name_hidden').value,
            package_name: document.getElementById('pkg_name').value,
            count: pilgrimsData.length,
            room_type: document.getElementById('room_type').value,
            // При ручном подселении (выбор комнаты) НЕ фильтруем по полу
            gender: ''
        });

        try {
            const r = await fetch(`${API_URL}/api/rooms?${params}`, { headers: {"ngrok-skip-browser-warning":"1"} });
            const res = await r.json();
            if (res.found && res.rooms.length > 0) {
                sel.innerHTML = res.rooms.map(rm => {
                    const icon = rm.gender === 'F'
                        ? '🚺'
                        : (rm.gender === 'M' ? '🚹' : '⚪');
                    const label = rm.label || `${rm.type} · ${rm.last_guest || 'Свободно'} (Свободно: ${rm.free})`;
                    return `<option value="${rm.row}">${icon} ${label} [Строка: ${rm.row}]</option>`;
                }).join('');
            } else {
                sel.innerHTML = '<option value="">Нет мест для подселения</option>';
            }
        } catch(e) { sel.innerHTML = '<option>Ошибка загрузки</option>'; }
    }

    async function finalSubmit() {
        const method = currentMode === 'edit'
            ? 'auto'
            : document.querySelector('input[name="place_method"]:checked').value;
        let row = null;
        if (method === 'pick') row = document.getElementById('room_select').value;
        if (method === 'manual') row = document.getElementById('manual_row_input').value;

        for (let i = 0; i < pilgrimsData.length; i++) {
            const p = pilgrimsData[i];
            const hasName = (p.first_name && p.first_name !== '-') || (p.last_name && p.last_name !== '-');
            const hasGender = p.gender === 'M' || p.gender === 'F';
            if (hasName && !hasGender) {
                alert(`Укажите пол для паломника #${i + 1}`);
                return;
            }
        }

        const pilgrims = pilgrimsData.map(p => ({
            first_name: p.first_name,
            last_name: p.last_name,
            phone: p.phone,
            passport_num: p.passport_num,
            date_of_birth: p.date_of_birth,
            gender: p.gender,
            passport_expiry: p.passport_expiry,
            iin: p.iin,
            passport_image_path: p.passport_image_path || null,
            is_infant: p.is_infant || false,
            is_child: p.is_child || false
        }));

        console.log("📤 Отправка данных на сервер:", pilgrims);

        const data = {
            pilgrims: pilgrims,
            package_name: document.getElementById('pkg_name').value,
            sheet_name: document.getElementById('sheet_name_hidden').value,
            table_id: document.getElementById('table_id_hidden').value,
            departure_city: document.querySelector('input[name="departure_city"]:checked').value,
            room_type: document.getElementById('room_type').value,
            meal_type: document.getElementById('meal_type').value,
            visa_status: document.getElementById('visa_status').value,
            avia: document.getElementById('avia').value,
            price: document.getElementById('price').value,
            amount_paid: document.getElementById('amount_paid').value,
            contract_number: document.getElementById('contract_number').value,
            exchange_rate: document.getElementById('exchange_rate').value,
            discount: document.getElementById('discount').value,
            source: document.getElementById('source').value,
            region: document.getElementById('region').value,
            train: document.getElementById('train').value,
            manager_name_text: managerHiddenInput.value,
            comment: document.getElementById('comment').value,
            placement_type: document.querySelector('input[name="placement_type"]:checked')?.value || 'separate',
            specific_row: row ? parseInt(row) : null,
            manager_id: tg.initDataUnsafe?.user?.id || 0
        };

        console.log("📤 Режим отправки:", currentMode);
        console.log("   booking_id:", currentBookingId);
        console.log("   old_booking_id:", currentOldBookingId);

        try {
            const btn = document.getElementById('finish_btn');
            btn.disabled = true;

            // Определяем endpoint и метод в зависимости от режима
            let endpoint, method, btnText;

	            if (currentMode === 'edit' && currentBookingId) {
	                // Режим редактирования - обновляем существующую бронь
	                endpoint = `${API_URL}/api/bookings/${currentBookingId}`;
	                method = "PATCH";
	                btnText = '<span class="icon">⏳</span> Сохраняю изменения...';
	                console.log("✏️ РЕДАКТИРОВАНИЕ брони #" + currentBookingId);
	            } else if (currentMode === 'reschedule') {
	                // Режим переноса: создаём заявку на перенос (без записи в Google Sheets)
	                endpoint = `${API_URL}/api/bookings/reschedule/request`;
	                method = "POST";
	                btnText = '<span class="icon">⏳</span> Отправляю заявку на перенос...';
	                console.log("♻️ ЗАЯВКА НА ПЕРЕНОС (через админа)");
	            } else {
	                // Режим создания или переноса - создаем новую бронь
	                endpoint = `${API_URL}/api/bookings/submit`;
	                method = "POST";
	                btnText = '<span class="icon">⏳</span> Записываю...';

                if (currentMode === 'reschedule' && currentOldBookingId) {
                    console.log("♻️ ПЕРЕНОС брони (старая #" + currentOldBookingId + ")");
                } else {
                    console.log("➕ СОЗДАНИЕ новой брони");
                }
	            }

	            btn.innerHTML = btnText;

	        if (currentMode === 'reschedule') {
	            data.old_booking_id = currentOldBookingId ? parseInt(currentOldBookingId, 10) : null;
	            if (Array.isArray(currentOldBookingIds) && currentOldBookingIds.length > 0) {
	                // Если по какой-то причине старый список "не соответствует" текущему кол-ву паломников,
	                // отправляем перенос как одиночный (чтобы не падать с ошибкой)
	                const normalized = currentOldBookingIds.map(n => parseInt(n, 10)).filter(n => Number.isFinite(n));
	                if (normalized.length === pilgrims.length) {
	                    data.old_booking_ids = normalized;
	                } else if (data.old_booking_id) {
	                    data.old_booking_ids = [data.old_booking_id];
	                }
	            } else if (data.old_booking_id) {
	                data.old_booking_ids = [data.old_booking_id];
	            }
	        }

	            const res = await fetch(endpoint, {
	                method,
	                headers: {
	                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "1"
                },
                body: JSON.stringify(data)
            });

            const json = await res.json().catch(() => ({}));

            if (!res.ok || !json.ok) {
                const msg = json.error || `Ошибка сервера: ${res.status}`;
                alert("❌ Ошибка размещения: " + msg);
                btn.disabled = false;
                btn.innerHTML = '<span class="icon">✅</span> ЗАВЕРШИТЬ И ЗАПИСАТЬ';
                return;
            }

	            // Показываем сообщение об успехе в зависимости от режима
	            let successMessage;
	            if (currentMode === 'edit') {
	                successMessage = "✅ Изменения успешно сохранены!";
	            } else if (currentMode === 'reschedule') {
	                successMessage = "✅ Заявка на перенос отправлена администратору. Ожидайте подтверждения.";
	            } else {
	                successMessage = "✅ Бронь успешно размещена!";
	            }
	            alert(successMessage);

	            // Если это была конвертация OPEN DATE, переносим паломника из Certificate в ИСПОЛЬЗОВАННЫЕ
	            if (openDateId && currentMode !== 'edit' && currentMode !== 'reschedule') {
	                console.log("📅 Конвертация OPEN DATE #" + openDateId);
	                try {
	                    const convertResponse = await fetch(`${API_URL}/api/open-date/convert/${openDateId}`, {
	                        method: 'POST',
	                        headers: {
	                            "Content-Type": "application/json",
	                            "ngrok-skip-browser-warning": "1"
	                        },
	                        body: JSON.stringify({
	                            open_date_id: parseInt(openDateId, 10),
	                            package_name: data.package_name,
	                            sheet_name: data.sheet_name,
	                            table_id: data.table_id,
	                            selected_date: document.getElementById('date_input').value
	                        })
	                    });

	                    const convertJson = await convertResponse.json().catch(() => ({}));

	                    if (convertResponse.ok && convertJson.success) {
	                        console.log("✅ OPEN DATE успешно конвертирован");
	                    } else {
	                        console.warn("⚠️ Ошибка конвертации OPEN DATE:", convertJson.error || "Неизвестная ошибка");
	                        // Не показываем alert, чтобы не путать пользователя - бронь уже создана
	                    }
	                } catch (convertError) {
	                    console.error("❌ Ошибка при конвертации OPEN DATE:", convertError);
	                    // Не показываем alert, чтобы не путать пользователя - бронь уже создана
	                }
	            }

	            // Отправляем событие в Telegram для возврата в главное меню
	            if (currentMode === 'reschedule') {
	                tg.sendData(JSON.stringify({
	                    action: "booking_completed",
	                    mode: "reschedule_request",
	                    request_id: json.request_id || null,
	                    booking_id: json.booking_id || null
	                }));
	            } else {
	                tg.sendData(JSON.stringify({
	                    action: "booking_completed",
	                    mode: currentMode,
	                    saved_rows: json.saved_rows || []
	                }));
	            }

            // Закрываем WebApp
            tg.close();
        } catch (e) {
            alert("❌ Ошибка сети: " + e);
            const btn = document.getElementById('finish_btn');
            btn.disabled = false;
            btn.innerHTML = '<span class="icon">✅</span> ЗАВЕРШИТЬ И ЗАПИСАТЬ';
        }
    }
</script>
</body>
</html>
