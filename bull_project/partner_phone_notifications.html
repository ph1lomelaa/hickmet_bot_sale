<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 Phone Notifications - Hickmet Travel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status {
            padding: 15px 30px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .phones {
            padding: 20px 30px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .phone-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .phone-item.new {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .phone-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .phone-item.new .phone-number {
            color: #4caf50;
        }

        .guest-name {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .booking-info {
            font-size: 14px;
            color: #666;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }

        .pulse {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.1);
            }
        }

        .footer {
            padding: 15px 30px;
            background: #f8f9fa;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 Phone Notifications</h1>
            <p>Real-time booking phone numbers from Hickmet Travel</p>
        </div>

        <div id="status" class="status connecting">
            <span class="pulse"></span>
            <span>Connecting to server...</span>
        </div>

        <div class="phones" id="phones">
            <div class="no-data">
                Waiting for new phone numbers...<br>
                The system will automatically show new bookings here.
            </div>
        </div>

        <div class="footer">
            Powered by Hickmet Travel System | WebSocket Connection
        </div>
    </div>

    <audio id="notification-sound" preload="auto">
        <source src="data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAADhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAA4YjkT9xAAAAAAD/+xDEAAPAAAGkAAAAIAAANIAAAARMQU1FMy4xMDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/+xDEAAPAAAGkAAAAIAAANIAAAARMQU1FMy4xMDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD/+xDEAAPAAAGkAAAAIAAANIAAAARMQU1FMy4xMDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" type="audio/mp3">
    </audio>

    <script>
        // Configuration
        const WS_URL = 'wss://hickmet-api-bull-project.koyeb.app/ws/phones';

        // Elements
        const statusDiv = document.getElementById('status');
        const phonesDiv = document.getElementById('phones');
        const sound = document.getElementById('notification-sound');

        let ws = null;
        let reconnectInterval = null;

        // Connect to WebSocket
        function connect() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('✅ Connected to WebSocket');
                statusDiv.className = 'status connected';
                statusDiv.innerHTML = `
                    <span class="pulse"></span>
                    <span>✅ Connected - receiving phone numbers in real-time</span>
                `;

                // Clear reconnect interval if exists
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('📱 New phone received:', data);

                    // Remove "no data" message
                    const noData = phonesDiv.querySelector('.no-data');
                    if (noData) {
                        noData.remove();
                    }

                    // Create phone item
                    const phoneDiv = document.createElement('div');
                    phoneDiv.className = 'phone-item new';

                    const time = new Date(data.timestamp);
                    const timeStr = time.toLocaleString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    });

                    phoneDiv.innerHTML = `
                        <div class="phone-number">📱 ${data.phone}</div>
                        <div class="guest-name">👤 ${data.guest_name || 'Guest'}</div>
                        <div class="booking-info">
                            <div class="info-item">
                                <span>🆔</span>
                                <span>Booking ID: ${data.booking_id}</span>
                            </div>
                            <div class="info-item">
                                <span>🕐</span>
                                <span>${timeStr}</span>
                            </div>
                        </div>
                    `;

                    // Insert at the top
                    phonesDiv.insertBefore(phoneDiv, phonesDiv.firstChild);

                    // Remove "new" class after 5 seconds
                    setTimeout(() => {
                        phoneDiv.classList.remove('new');
                    }, 5000);

                    // Play notification sound
                    sound.play().catch(err => console.log('Sound play failed:', err));

                    // Show browser notification
                    if (Notification.permission === 'granted') {
                        new Notification('New Phone Number! 📱', {
                            body: `${data.phone}\n${data.guest_name}\nBooking ID: ${data.booking_id}`,
                            icon: '📱',
                            tag: 'phone-notification',
                            requireInteraction: false
                        });
                    }

                    // Vibrate on mobile
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]);
                    }

                } catch (err) {
                    console.error('Error parsing message:', err);
                }
            };

            ws.onclose = () => {
                console.log('❌ Disconnected from WebSocket');
                statusDiv.className = 'status disconnected';
                statusDiv.innerHTML = `
                    <span>❌ Disconnected - trying to reconnect...</span>
                `;

                // Try to reconnect every 5 seconds
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(() => {
                        console.log('🔄 Attempting to reconnect...');
                        connect();
                    }, 5000);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusDiv.className = 'status disconnected';
                statusDiv.innerHTML = `
                    <span>⚠️ Connection error - retrying...</span>
                `;
            };
        }

        // Request notification permission
        if (Notification.permission === 'default') {
            Notification.requestPermission().then(permission => {
                console.log('Notification permission:', permission);
            });
        }

        // Start connection
        connect();

        // Keep connection alive with ping every 30 seconds
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send('ping');
            }
        }, 30000);
    </script>
</body>
</html>
